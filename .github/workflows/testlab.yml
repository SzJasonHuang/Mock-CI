name: Test-Lab Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Test-Lab Tests
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://www.test-lab.ai/api/v1/run \
            -H "Authorization: Bearer ${{ secrets.TESTLAB_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"testPlanIds": [2356], "buildId": "${{ github.sha }}"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Test-Lab run trigger failed with HTTP $HTTP_CODE"
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              -d "{\"state\":\"failure\",\"context\":\"test-lab\",\"description\":\"Failed to trigger Test-Lab run (HTTP $HTTP_CODE)\"}"
            exit 1
          fi

          # The API only confirms the run was queued, not whether it passed.
          # Test-Lab reports the real pass/fail result asynchronously via
          # webhook, which flips this same "test-lab" status to success/failure.
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"test-lab","description":"Test-Lab run queued, waiting for result"}'
